---
# Postgres GCS Backup - Main Tasks
# Architecture: Fetch backups from target → Upload from container → Credentials stay in container

- name: Check if backup directory exists on target
  ansible.builtin.stat:
    path: "{{ backup_source_dir }}"
  register: backup_dir

- name: Fail if backup directory doesn't exist
  ansible.builtin.fail:
    msg: "Backup directory {{ backup_source_dir }} does not exist on target"
  when: not backup_dir.stat.exists

- name: List recent backup files on target
  ansible.builtin.find:
    paths: "{{ backup_source_dir }}"
    patterns: "*.sql.gz"
    age: "-{{ backup_age_threshold }}d"
  register: backup_files

- name: Display found backup files
  ansible.builtin.debug:
    msg: "Found {{ backup_files.files | length }} backup file(s) from last {{ backup_age_threshold }} day(s) on target"

- name: Fail if no recent backups found
  ansible.builtin.fail:
    msg: "No backup files found in {{ backup_source_dir }} from the last {{ backup_age_threshold }} day(s)"
  when:
    - fail_on_missing_backups
    - backup_files.files | length == 0

- name: Check prerequisites in container
  ansible.builtin.include_tasks: check-prerequisites.yml

- name: Fetch backup files from target to container
  ansible.builtin.include_tasks: fetch-backups.yml

- name: Upload backups to GCS from container
  ansible.builtin.include_tasks: upload-to-gcs.yml

- name: Verify uploads
  ansible.builtin.include_tasks: verify-uploads.yml

- name: Cleanup old backups in GCS
  ansible.builtin.include_tasks: cleanup-old-backups.yml
  when: retention_days > 0

- name: Cleanup temp files in container
  ansible.builtin.include_tasks: cleanup-container.yml

- name: Display summary
  ansible.builtin.debug:
    msg:
      - "✅ Backup sync completed successfully!"
      - "Uploaded: {{ backup_files.files | length }} file(s)"
      - "GCS bucket: gs://{{ gcs_bucket }}/{{ gcs_prefix }}/"
      - "Retention: {{ retention_days }} days"
      - "🔒 Credentials remained isolated in container"
