---
# Verify uploads to GCS

- name: List files in GCS bucket
  ansible.builtin.command:
    cmd: >
      gsutil ls gs://{{ gcs_bucket }}/{{ gcs_prefix }}/
  environment: "{{ gcs_env }}"
  register: gcs_list
  changed_when: false

- name: Display uploaded files
  ansible.builtin.debug:
    msg: "{{ gcs_list.stdout_lines }}"

- name: Verify each database backup was uploaded
  ansible.builtin.assert:
    that:
      - "item + '.sql.gz' in gcs_list.stdout"
    fail_msg: "Backup for {{ item }} was not found in GCS"
    success_msg: "Backup for {{ item }} verified in GCS"
  loop: "{{ postgres_databases }}"
