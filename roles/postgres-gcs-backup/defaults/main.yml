---
# Postgres GCS Backup Role - Default Variables

# Source directory for postgres backups on target host
backup_source_dir: "/var/backup/postgresql"

# Container temp directory for fetched backups
container_temp_dir: "/tmp/postgres-backups"

# GCS configuration
gcs_bucket: "iv3-infra-us-prod"
gcs_prefix: "postgres-backups"

# Retention in days
retention_days: 30

# Service account key location (in container)
service_account_key: "/root/.gcp/service-account.json"

# Databases to backup
postgres_databases:
  - n8n
  - forgejo
  - kestra
  - kaneo

# Fail if no recent backups found
fail_on_missing_backups: true

# Age threshold for "recent" backups (in days)
backup_age_threshold: 1
