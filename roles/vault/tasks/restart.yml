---
# Restart Vault service using generic systemd role
- name: Restart and enable Vault service
  ansible.builtin.include_role:
    name: systemd
  vars:
    systemd_service_name: "{{ vault_service_name }}"
    systemd_service_state: restarted
    systemd_service_enabled: true
    systemd_wait_for_port: 8200
    systemd_wait_timeout: 30

- name: Get Vault status
  ansible.builtin.command: vault status
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
  register: vault_status_output
  failed_when: false
  changed_when: false

- name: Display Vault status
  ansible.builtin.debug:
    msg: "{{ vault_status_output.stdout_lines }}"
