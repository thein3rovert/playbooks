---
# Tailscale role - Install and Configure Tailscale VPN

- name: Install prerequisties
  ansible.builtin.apt:
    name:
      - curl
  become: true

- name: Check if Tailscale is installed
  ansible.builtin.command:
    cmd: "which tailscale"
  register: tailscale_binary
  changed_when: false
  failed_when: false

  # If tailscale not installed
- name: Install Tailscale
  ansible.builtin.shell:
    cmd: "curl -fsSL https://tailscale.com/install.sh | sh"
  when: tailscale_binary.rc != 0
  become: true

- name: Enable and Start tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
  when: tailscale_binary.rc != 0
  become: true

- name: Check if tailscale is authenticated
  ansible.builtin.command:
    cmd: "tailscale status"
  register: tailscale_status
  changed_when: false
  failed_when: false
  become: true

# Generate a short-lived, single-use key only for hosts that need enrollment.
- name: Generate fresh Tailscale auth key
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/tailnet/{{ tailscale_tailnet }}/keys"
    method: POST
    headers:
      Authorization: "Bearer {{ tailscale_api_token }}"
    body_format: json
    body:
      capabilities:
        devices:
          create:
            reusable: false
            ephemeral: false
            preauthorized: true
            tags: []
      expirySeconds: "{{ tailscale_authkey_expiry_seconds }}"
    status_code: 200
  register: fresh_key_response
  delegate_to: localhost
  no_log: true
  when:
    - tailscale_status.rc != 0
    - tailscale_api_token is defined
    - tailscale_tailnet is defined

- name: Set fresh auth key as fact
  ansible.builtin.set_fact:
    tailscale_authkey: "{{ fresh_key_response.json.key }}"
  no_log: true
  when:
    - fresh_key_response is not skipped
    - fresh_key_response.json.key is defined

# If tailscale not authenticated > authenticate
- name: Authenticate and configure Tailscale with auth key
  ansible.builtin.command:
    cmd: "tailscale up {{ tailscale_up_flags }} --authkey={{ tailscale_authkey }}"
  when:
    - tailscale_status.rc != 0
    - tailscale_authkey is defined
  become: true
  no_log: true

