---
# Prometheus role - Install and configure Prometheus monitoring components
# Primarily for node_exporter on Ubuntu hosts
# Configured to use port 3021 to match NixOS hosts

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  become: true

- name: Install prometheus-node-exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
  become: true

- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    mode: '0755'
  become: true

- name: Configure node exporter to use port 3021
  ansible.builtin.copy:
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/prometheus-node-exporter --web.listen-address=:3021
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
    mode: '0644'
  become: true
  register: port_override

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes
  become: true
  when: port_override.changed

- name: Enable and start prometheus-node-exporter service
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: started
    enabled: true
  become: true
  when: not ansible_check_mode

- name: Restart service if config changed
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: restarted
  become: true
  when: port_override.changed and not ansible_check_mode

- name: Wait for node exporter to be available
  ansible.builtin.wait_for:
    port: 3021
    timeout: 30
  ignore_errors: true
  when: not ansible_check_mode

- name: Verify prometheus-node-exporter is running
  ansible.builtin.command:
    cmd: "systemctl status prometheus-node-exporter"
  register: exporter_status
  changed_when: false
  failed_when: false
  become: true
  when: not ansible_check_mode

- name: Display prometheus-node-exporter status
  ansible.builtin.debug:
    msg:
      - "✅ Prometheus Node Exporter will be installed and enabled"
      - "Service will listen on port 3021 (matching NixOS hosts)"
      - "Status: {{ 'Active' if exporter_status.stdout is defined and 'active (running)' in exporter_status.stdout else 'Will start after installation' }}"
