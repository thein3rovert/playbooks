---
# User account and SSH paths
default_user_home: "/home/{{ default_user }}"
ssh_path: "{{ default_user_home }}/.ssh"
authorized_keys_path: "{{ ssh_path }}/authorized_keys"
default_user_permission: "0700"
authorized_keys_permission: "0600"

# SSH daemon settings
user_sshd_config_path: /etc/ssh/sshd_config
user_sshd_binary: /usr/sbin/sshd
user_ssh_service_names:
  Debian: ssh
  RedHat: sshd
  Suse: sshd
user_ssh_service_name: "{{ user_ssh_service_names.get(ansible_facts.os_family, 'sshd') }}"
user_role_supported_os_families:
  - Debian
  - RedHat
  - Suse
